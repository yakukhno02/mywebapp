---
services:
  database:
    container_name: database
    image: postgres:16
    environment:
      POSTGRES_DB: mywebapp
      POSTGRES_USER: app
      POSTGRES_PASSWORD: 12345678
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - my_network

  web:
    container_name: mywebapp
    image: ghcr.io/yakukhno02/mywebapp:latest
    depends_on:
      - database
    networks:
      - my_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/mywebapp
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: 12345678
      SERVER_PORT: 5000
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - my_network

volumes:
  db_data:

networks:
  my_network:
